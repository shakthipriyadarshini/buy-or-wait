# One-click deploy on Render: New > Blueprint > point at this repo.
# Works on the free tier. Other Docker-capable hosts (Railway, Fly.io,
# Google Cloud Run) can use the Dockerfile directly instead.
services:
  - type: web
    name: buy-or-wait
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Set this in the Render dashboard, not here — never commit a key.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_RPM_LIMIT
        value: "5"
      - key: CORS_ORIGINS
        value: "*"
